# Fly.io configuration for SettleSide.
# Region: pick the one closest to your Supabase project (shown on its
# dashboard) - "fra" for eu-central, "sin" for Singapore, "bom" for Mumbai.
app = "settleside"
primary_region = "sin"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
